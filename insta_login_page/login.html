<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instagram login</title>
    <link rel="icon" type="image/png" href="https://tse1.mm.bing.net/th/id/OIP.3e_TBT9vkdRRT2u29joEhQHaHa?r=0&pid=Api&P=0&h=180">
<link rel="stylesheet" href="login.css">
<link
 href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap"
 rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="logo">Instagram</h1>
        <p>Welcome back! Please log in. </p>
        <form id="loginform">
            <input type="text" id="username"
            placeholder="Phone Number, username or email">
            <small id="usernameError" class="error"></small>
            <div class="password-box">
             <input type="password" id="password" placeholder="password">
             <span id="togglePassword">👁️</span>
             <small id="passwordError" class="error"></small>
            </div>
            <button type="submit" id="loginBtn">Log in </button>
            <a href="#" class="forgot">forgot password?</a>
        </form>
    </div>
    <div class="signup-box"> <p>don't have an acount?<a href="#">sign up</a>
    </p>
    </div>
    <script src="login.js"></script>
</body>
</html>
